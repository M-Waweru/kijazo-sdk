name: Deploy Kijazo API to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kijazo-api-production
  cancel-in-progress: false

jobs:
  check:
    name: Check SDK and Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: npm test
      - name: Syntax and module checks
        run: npm run check

  deploy:
    name: Deploy Cloudflare Worker
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN. Add it under GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Install Cloudflare CLI
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Deploy Kijazo API
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository variable."
            exit 1
          fi
          npx wrangler deploy
      - name: Verify health endpoint
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            https://kijazo-api.mathenge2waweru.workers.dev/health \
            | grep -F '"ok":true'
